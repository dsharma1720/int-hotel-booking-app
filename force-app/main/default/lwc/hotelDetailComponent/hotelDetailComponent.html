<template>
    <template if:true={hotel}>

<lightning-card title="Hotel Details">

<div class="slds-p-around_medium">

<div class="detail-top">
    <h1 class="hotel-title">{hotel.Hotel_Name__c}</h1>
    <div class="hotel-rating">
        <template for:each={stars} for:item="star">
            <span key={star.key} class={star.cls}>&#9733;</span>
        </template>
        <span class="rating-number">{hotel.Hotel_Rating__c}</span>
    </div>
</div>

<p><b>City:</b> {hotel.Hotel_City__c}</p>
<p><b>Type:</b> {hotel.Hotel_Type__c}</p>

<p><b>Price per Night:</b>
<lightning-formatted-number
value={hotel.Per_Day_Cost__c}
format-style="currency"
currency-code="INR">
<span class="price-text"> / night</span>
</lightning-formatted-number>
</p>

<div class="amenities">
    <span class="amenity-badge">
        &#128246; WiFi
        <template if:true={hotel.WiFi_Availability__c}><span class="badge-yes">&#10003;</span></template>
        <template if:false={hotel.WiFi_Availability__c}><span class="badge-no">&#10007;</span></template>
    </span>
    <span class="amenity-badge">
        &#128181; Cash Pay
        <template if:true={hotel.Cash_Pay_Availability__c}><span class="badge-yes">&#10003;</span></template>
        <template if:false={hotel.Cash_Pay_Availability__c}><span class="badge-no">&#10007;</span></template>
    </span>
    <span class="amenity-badge">
        &#8635; Cancellation
        <template if:true={hotel.Cancellation_Availability__c}><span class="badge-yes">&#10003;</span></template>
        <template if:false={hotel.Cancellation_Availability__c}><span class="badge-no">&#10007;</span></template>
    </span>
</div>

<div class="slds-m-top_large">

<lightning-button
variant="brand"
label="Book Hotel"
onclick={handleBook}>
</lightning-button>

</div>

</div>

</lightning-card>

</template>
<template if:false={hotel}>

<lightning-card title="Hotel Details">
<div class="slds-p-around_medium slds-text-align_center">

<p>Select a hotel from the Hotel Lists page to view details.</p>

</div>
</lightning-card>

</template>
</template>
