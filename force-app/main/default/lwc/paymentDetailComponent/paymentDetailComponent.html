<template>
    <c-header-component></c-header-component>
    <lightning-card title="Payment Details">

        <div class="slds-p-around_medium">

            <lightning-input
                label="Card Number"
               maxlength="23"
               type="text"
               inputmode="numeric"
               value={cardNumber}
               onchange={handleCardNumberChange}
               >
            </lightning-input>
            <template if:true={cardType}>
    <div class="card-type">
        💳 {cardType}
    </div>
</template>
            <template if:true={cardError}>
    <div class="slds-text-color_error slds-text-body_small">
        {cardError}
    </div>
</template>

            <lightning-input
                label="CVV"
                
               maxlength="4"
                type="text"
                inputmode="numeric"
                value={cvv}
                onchange={handleCvvChange}
                >
            </lightning-input>
<template if:true={cvvError}>
    <div class="slds-text-color_error slds-text-body_small">
        {cvvError}
    </div>
</template>
            <lightning-combobox
                label="Expiry Month"
                data-field="expiryMonth"
                value={expiryMonth}
                options={monthOptions}
                onchange={handleChange}
                required>
            </lightning-combobox>
            <template if:true={monthError}>
    <div class="slds-text-color_error slds-text-body_small">
        {monthError}
    </div>
</template>

            <lightning-combobox
                label="Expiry Year"
                data-field="expiryYear"
                   value={expiryYear}
                options={yearOptions}
                onchange={handleChange}
                required>
            </lightning-combobox>
            <template if:true={yearError}>
    <div class="slds-text-color_error slds-text-body_small">
        {yearError}
    </div>
</template>

            <br/>

            <lightning-button
                label="Submit Payment"
                variant="brand"
                onclick={handleSubmit}>
            </lightning-button>

        </div>
    </lightning-card>
</template>
